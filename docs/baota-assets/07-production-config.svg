<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" role="img" aria-labelledby="title desc">
  <title id="title">生产环境配置关系</title>
  <desc id="desc">展示浏览器域名、Nginx、前端环境变量、后台环境变量和站点档案之间的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1320" height="560" fill="#f7f9fc"/>
  <text x="48" y="54" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">生产环境配置关系</text>
  <text x="48" y="86" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#667085">公网只使用 HTTPS 域名；内部端口、Linux 路径和站点网址各司其职。</text>

  <rect x="48" y="126" width="252" height="126" rx="8" fill="#ffffff" stroke="#9eb8dc" stroke-width="2"/>
  <rect x="48" y="126" width="252" height="34" rx="8" fill="#eaf3ff"/>
  <rect x="48" y="152" width="252" height="8" fill="#eaf3ff"/>
  <text x="66" y="149" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#145dbf">浏览器访问</text>
  <text x="66" y="190" font-family="Consolas, monospace" font-size="15" fill="#172033">https://admin.example.com</text>
  <text x="66" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#667085">浏览器里不要填写 localhost</text>

  <rect x="378" y="126" width="252" height="126" rx="8" fill="#ffffff" stroke="#64b585" stroke-width="2"/>
  <rect x="378" y="126" width="252" height="34" rx="8" fill="#e9f8ef"/>
  <rect x="378" y="152" width="252" height="8" fill="#e9f8ef"/>
  <text x="396" y="149" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#168047">Nginx</text>
  <text x="396" y="190" font-family="Consolas, monospace" font-size="15" fill="#172033">/       → frontend/dist</text>
  <text x="396" y="220" font-family="Consolas, monospace" font-size="15" fill="#172033">/api/   → 127.0.0.1:5108</text>

  <rect x="708" y="126" width="252" height="126" rx="8" fill="#ffffff" stroke="#f0a24d" stroke-width="2"/>
  <rect x="708" y="126" width="252" height="34" rx="8" fill="#fff4e6"/>
  <rect x="708" y="152" width="252" height="8" fill="#fff4e6"/>
  <text x="726" y="149" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#b75b00">前端生产变量</text>
  <text x="726" y="190" font-family="Consolas, monospace" font-size="15" fill="#172033">VITE_API_BASE_URL=/api</text>
  <text x="726" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#667085">构建前写入 .env.production</text>

  <rect x="1038" y="126" width="234" height="126" rx="8" fill="#ffffff" stroke="#9b8bd7" stroke-width="2"/>
  <rect x="1038" y="126" width="234" height="34" rx="8" fill="#f1edff"/>
  <rect x="1038" y="152" width="234" height="8" fill="#f1edff"/>
  <text x="1056" y="149" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#5f49b5">后台运行变量</text>
  <text x="1056" y="190" font-family="Consolas, monospace" font-size="14" fill="#172033">DB_SQLJS_LOCATION</text>
  <text x="1056" y="220" font-family="Consolas, monospace" font-size="14" fill="#172033">BACKEND_PORT=5108</text>

  <path d="M300 189 H368" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M630 189 H698" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M960 189 H1028" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="48" y="314" width="584" height="178" rx="8" fill="#ffffff" stroke="#ccd5e3" stroke-width="2"/>
  <text x="70" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">集中后台数据库</text>
  <text x="70" y="386" font-family="Consolas, monospace" font-size="15" fill="#145dbf">/www/wwwroot/pboot_admin_center/data/pboot-admin.sqlite</text>
  <line x1="70" y1="408" x2="610" y2="408" stroke="#e2e8f0"/>
  <text x="70" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475467">保存管理员、站点档案、报价单和项目自身数据</text>
  <text x="70" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#b54708">不等于任何一个 PbootCMS 网站数据库</text>

  <rect x="688" y="314" width="584" height="178" rx="8" fill="#ffffff" stroke="#ccd5e3" stroke-width="2"/>
  <text x="710" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">当前站点档案</text>
  <text x="710" y="386" font-family="Consolas, monospace" font-size="15" fill="#168047">Root: /www/wwwroot/shanbo.cc</text>
  <text x="710" y="416" font-family="Consolas, monospace" font-size="15" fill="#168047">DB:   /www/wwwroot/shanbo.cc/data/*.db</text>
  <text x="710" y="446" font-family="Consolas, monospace" font-size="15" fill="#168047">URL:  https://shanbo.cc</text>
  <text x="710" y="476" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475467">切换站点后，内容同步指向对应的网站</text>
</svg>
