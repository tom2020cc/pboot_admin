<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">宝塔部署流程</title>
  <desc id="desc">从本地备份到上传、安装依赖、构建、PM2 启动、Nginx 与 SSL、添加站点及验收的顺序。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs>
  <style>.title{font:700 28px "Microsoft YaHei",Arial;fill:#172033}.num{font:700 18px "Microsoft YaHei",Arial;fill:#fff}.head{font:700 16px "Microsoft YaHei",Arial;fill:#172033}.text{font:13px "Microsoft YaHei",Arial;fill:#667085}.box{fill:#fff;stroke:#cfd8e6;stroke-width:2}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <rect width="1200" height="520" fill="#f5f7fa"/><text x="50" y="52" class="title">严格按顺序部署，出错时更容易定位</text>
  <path d="M170 192H234M370 192H434M570 192H634M770 192H834M970 192H1034" class="line"/>
  <path d="M1100 252V340H970" class="line"/><path d="M834 400H770M634 400H570M434 400H370" class="line"/>
  <g transform="translate(50 112)"><rect width="120" height="160" rx="8" class="box"/><circle cx="60" cy="42" r="23" fill="#1677ff"/><text x="60" y="49" text-anchor="middle" class="num">1</text><text x="60" y="88" text-anchor="middle" class="head">本地备份</text><text x="60" y="116" text-anchor="middle" class="text">配置与数据库</text><text x="60" y="140" text-anchor="middle" class="text">保留回滚包</text></g>
  <g transform="translate(250 112)"><rect width="120" height="160" rx="8" class="box"/><circle cx="60" cy="42" r="23" fill="#1677ff"/><text x="60" y="49" text-anchor="middle" class="num">2</text><text x="60" y="88" text-anchor="middle" class="head">上传项目</text><text x="60" y="116" text-anchor="middle" class="text">/www/wwwroot</text><text x="60" y="140" text-anchor="middle" class="text">检查目录</text></g>
  <g transform="translate(450 112)"><rect width="120" height="160" rx="8" class="box"/><circle cx="60" cy="42" r="23" fill="#2f9e5b"/><text x="60" y="49" text-anchor="middle" class="num">3</text><text x="60" y="88" text-anchor="middle" class="head">安装与构建</text><text x="60" y="116" text-anchor="middle" class="text">pnpm install</text><text x="60" y="140" text-anchor="middle" class="text">pnpm build</text></g>
  <g transform="translate(650 112)"><rect width="120" height="160" rx="8" class="box"/><circle cx="60" cy="42" r="23" fill="#2f9e5b"/><text x="60" y="49" text-anchor="middle" class="num">4</text><text x="60" y="88" text-anchor="middle" class="head">配置 .env</text><text x="60" y="116" text-anchor="middle" class="text">Linux 路径</text><text x="60" y="140" text-anchor="middle" class="text">导入 Key</text></g>
  <g transform="translate(850 112)"><rect width="120" height="160" rx="8" class="box"/><circle cx="60" cy="42" r="23" fill="#ee9418"/><text x="60" y="49" text-anchor="middle" class="num">5</text><text x="60" y="88" text-anchor="middle" class="head">PM2 启动</text><text x="60" y="116" text-anchor="middle" class="text">API / SEO / FTP</text><text x="60" y="140" text-anchor="middle" class="text">本机端口检查</text></g>
  <g transform="translate(1050 112)"><rect width="120" height="160" rx="8" class="box"/><circle cx="60" cy="42" r="23" fill="#ee9418"/><text x="60" y="49" text-anchor="middle" class="num">6</text><text x="60" y="88" text-anchor="middle" class="head">Nginx 与 SSL</text><text x="60" y="116" text-anchor="middle" class="text">3 个域名</text><text x="60" y="140" text-anchor="middle" class="text">只开 80/443</text></g>
  <g transform="translate(850 330)"><rect width="120" height="140" rx="8" class="box"/><circle cx="60" cy="38" r="23" fill="#d94b35"/><text x="60" y="45" text-anchor="middle" class="num">7</text><text x="60" y="82" text-anchor="middle" class="head">添加站点</text><text x="60" y="110" text-anchor="middle" class="text">路径与数据库</text></g>
  <g transform="translate(650 330)"><rect width="120" height="140" rx="8" class="box"/><circle cx="60" cy="38" r="23" fill="#d94b35"/><text x="60" y="45" text-anchor="middle" class="num">8</text><text x="60" y="82" text-anchor="middle" class="head">只读验收</text><text x="60" y="110" text-anchor="middle" class="text">先检查再同步</text></g>
  <g transform="translate(450 330)"><rect width="120" height="140" rx="8" class="box"/><circle cx="60" cy="38" r="23" fill="#6d55c7"/><text x="60" y="45" text-anchor="middle" class="num">9</text><text x="60" y="82" text-anchor="middle" class="head">备份后写入</text><text x="60" y="110" text-anchor="middle" class="text">小范围验证</text></g>
  <g transform="translate(250 330)"><rect width="120" height="140" rx="8" class="box"/><circle cx="60" cy="38" r="23" fill="#6d55c7"/><text x="60" y="45" text-anchor="middle" class="num">10</text><text x="60" y="82" text-anchor="middle" class="head">正式使用</text><text x="60" y="110" text-anchor="middle" class="text">监控与定期备份</text></g>
</svg>
