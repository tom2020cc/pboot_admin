<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">创建 Google 服务账号并下载 JSON 密钥</title>
  <desc id="desc">在服务账号页面创建账号，进入密钥页并下载 JSON 文件。</desc>
  <rect width="900" height="420" fill="#f7f9fc"/>
  <rect x="24" y="24" width="852" height="58" rx="8" fill="#ffffff" stroke="#d8dee9"/>
  <text x="48" y="59" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">IAM 和管理 / 服务账号</text>
  <rect x="676" y="36" width="176" height="34" rx="6" fill="#1a73e8"/>
  <text x="764" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">+ 创建服务账号</text>
  <rect x="24" y="106" width="250" height="248" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <circle cx="58" cy="140" r="17" fill="#34a853"/>
  <text x="58" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="84" y="146" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">填写账号名称</text>
  <text x="46" y="190" font-family="Arial, sans-serif" font-size="12" fill="#64748b">服务账号名称</text>
  <rect x="46" y="202" width="206" height="38" rx="5" fill="#ffffff" stroke="#b8c2cf"/>
  <text x="58" y="226" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">shanbo-search-console</text>
  <text x="46" y="268" font-family="Arial, sans-serif" font-size="12" fill="#64748b">项目角色</text>
  <rect x="46" y="280" width="206" height="38" rx="5" fill="#f8fafc" stroke="#d8dee9"/>
  <text x="58" y="304" font-family="Arial, sans-serif" font-size="13" fill="#64748b">可跳过，不需要选择</text>
  <path d="M289 230h38" stroke="#9aa0a6" stroke-width="2"/>
  <path d="m322 224 8 6-8 6" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <rect x="342" y="106" width="250" height="248" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <circle cx="376" cy="140" r="17" fill="#4285f4"/>
  <text x="376" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="402" y="146" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">打开“密钥”标签</text>
  <rect x="364" y="178" width="206" height="42" rx="5" fill="#f1f5f9"/>
  <text x="386" y="204" font-family="Arial, sans-serif" font-size="13" fill="#64748b">详细信息</text>
  <rect x="364" y="226" width="206" height="42" rx="5" fill="#e8f0fe" stroke="#8ab4f8"/>
  <text x="386" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#174ea6">密钥</text>
  <rect x="364" y="286" width="160" height="38" rx="5" fill="#1a73e8"/>
  <text x="444" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">添加密钥</text>
  <path d="M607 230h38" stroke="#9aa0a6" stroke-width="2"/>
  <path d="m640 224 8 6-8 6" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <rect x="660" y="106" width="216" height="248" rx="8" fill="#ffffff" stroke="#f9ab00" stroke-width="2"/>
  <circle cx="694" cy="140" r="17" fill="#f9ab00"/>
  <text x="694" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="720" y="146" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">创建 JSON 密钥</text>
  <circle cx="692" cy="198" r="8" fill="#1a73e8"/>
  <circle cx="692" cy="198" r="3" fill="#ffffff"/>
  <text x="710" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">JSON</text>
  <circle cx="692" cy="234" r="8" fill="#ffffff" stroke="#9aa0a6"/>
  <text x="710" y="239" font-family="Arial, sans-serif" font-size="14" fill="#64748b">P12</text>
  <rect x="682" y="276" width="172" height="38" rx="5" fill="#1a73e8"/>
  <text x="768" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">创建并下载</text>
  <text x="24" y="390" font-family="Arial, sans-serif" font-size="12" fill="#64748b">JSON 中的 client_email 用于 Search Console 授权；private_key 用于本工具换取访问令牌。请勿编辑字段内容。</text>
</svg>
