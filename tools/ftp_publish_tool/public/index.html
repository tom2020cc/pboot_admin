<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/site-context.js"></script>
    <title>PbootCMS FTP 发布</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><div class="mark">FTP</div><span>PbootCMS FTP 发布</span></div>
      <div class="header-status" id="status">正在读取配置</div>
    </header>
    <nav class="tool-nav" id="toolNav" aria-label="项目工具导航"></nav>

    <main>
      <nav class="page-switch" aria-label="FTP 功能">
        <a class="active" href="/">发布管理</a>
        <a href="/security.html">安全巡检</a>
      </nav>

      <section class="card">
        <div class="section-heading">
          <div><h1>FTP 发布配置</h1><p class="subtitle">管理连接、上传范围和覆盖前备份。</p></div>
          <span class="status-badge" id="connectionBadge">尚未测试</span>
        </div>
        <div class="form-grid">
          <label class="field">FTP 地址<input id="host" placeholder="ftp.example.com" autocomplete="off" /></label>
          <label class="field">端口<input id="port" type="number" min="1" max="65535" value="21" /></label>
          <label class="field">用户名<input id="user" autocomplete="off" /></label>
          <label class="field">密码<input id="password" type="password" placeholder="留空则保留原密码" autocomplete="new-password" /></label>
          <label class="field">远程网站根目录<input id="remoteRoot" placeholder="/ 或 /wwwroot" /></label>
          <label class="field">连接方式<select id="secure"><option value="false">普通 FTP</option><option value="true">FTPS 加密</option></select></label>
          <label class="field">上传范围<select id="uploadScope"><option value="site">网站数据与图片</option><option value="seo">仅 SEO 收录文件</option><option value="full">整站上传</option></select></label>
          <label class="field">上传模式<select id="uploadMode"><option value="quick">快速上传（日常）</option><option value="full">完整校验（首次/大改）</option></select></label>
          <label class="field">最近图片天数<input id="recentImageDays" type="number" min="1" value="14" /></label>
          <label class="field">单文件备份上限（MB）<input id="backupMaxFileSizeMb" type="number" min="1" value="20" /></label>
        </div>
        <div class="checks">
          <label class="check"><input id="uploadDatabase" type="checkbox" checked />上传数据库</label>
          <label class="check"><input id="uploadImages" type="checkbox" checked />上传图片目录</label>
          <label class="check"><input id="skipSameSizeAssets" type="checkbox" checked />同大小二进制文件跳过</label>
          <label class="check"><input id="backupBeforeOverwrite" type="checkbox" checked />覆盖前下载备份</label>
        </div>
        <div class="mode-note" id="modeNote"></div>
        <div class="toolbar">
          <button class="primary" id="saveBtn">保存配置</button>
          <button id="planBtn">刷新上传计划</button>
          <button id="testBtn">测试连接</button>
          <button class="warning" id="uploadBtn">开始发布</button>
          <a class="hint" href="/security.html" style="margin-left:auto">前往安全巡检</a>
        </div>
      </section>

      <section class="card remote-preview" id="remotePreview">
        <div class="section-heading"><div><h2>远程目录预览</h2><p class="subtitle" id="remoteHint"></p></div></div>
        <div class="remote-meta">
          <span class="meta-tag" id="loginDir">登录目录：-</span>
          <span class="meta-tag" id="currentDir">当前目录：-</span>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>名称</th><th>类型</th><th>大小</th></tr></thead><tbody id="remoteItems"></tbody></table>
        </div>
      </section>

      <section class="metrics" aria-label="上传统计">
        <div class="metric"><span>计划文件</span><strong id="fileCount">-</strong></div>
        <div class="metric"><span>计划大小</span><strong id="totalSize">-</strong></div>
        <div class="metric"><span>已上传</span><strong id="uploaded">0</strong></div>
        <div class="metric"><span>已跳过</span><strong id="skipped">0</strong></div>
        <div class="metric safe"><span>覆盖前备份</span><strong id="backedUp">0</strong></div>
      </section>

      <section class="result-banner" id="resultBanner"><h2 id="resultTitle">发布状态</h2><p id="resultMessage">等待发布。</p></section>

      <section class="split">
        <div class="card">
          <div class="section-heading"><div><h2>上传范围</h2><p class="subtitle" id="planMeta"></p></div></div>
          <div class="table-wrap"><table><thead><tr><th>分组</th><th>数量</th><th>大小</th></tr></thead><tbody id="groups"></tbody></table></div>
        </div>
        <div class="card">
          <div class="section-heading"><div><h2>发布日志</h2><p class="subtitle" id="backupPath">尚无覆盖备份。</p></div></div>
          <div class="log" id="logs">等待操作。</div>
        </div>
      </section>

      <section class="card">
        <div class="section-heading"><div><h2>文件预览</h2><p class="subtitle">最多显示前 300 个待发布文件。</p></div></div>
        <div class="table-wrap"><table><thead><tr><th>路径</th><th>大小</th></tr></thead><tbody id="files"></tbody></table></div>
      </section>
    </main>

    <script src="/common.js"></script>
    <script src="/publish.js"></script>
  </body>
</html>
