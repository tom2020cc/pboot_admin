# Include only inside the PbootCMS business site's server block.
# Nginx does not enforce the Apache .htaccess rules shipped with PbootCMS.
location ^~ /data/ {
    return 404;
}

# Deployment archives at the document root are not public downloads.
location ~* ^/[^/]+\.(?:zip|7z|rar|tar|tgz|tar\.gz|sql|sqlite|sqlite3|db|bak)$ {
    return 404;
}
