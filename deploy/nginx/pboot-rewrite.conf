# PbootCMS 2.x / 3.x, installed at the document root.
# Paste into BaoTa > PHP website > Settings > URL rewrite.
# Do not add a second location / or apply to the Vue admin proxy.
# Source: https://www.pbootcms.com/docs/239.html
location / {
    if (!-e $request_filename) {
        rewrite ^/index.php(.*)$ /index.php?p=$1 last;
        rewrite ^(.*)$ /index.php?s=$1 last;
    }
}
