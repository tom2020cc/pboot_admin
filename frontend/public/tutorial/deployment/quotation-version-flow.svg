<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">读取已有产品译文，商务数值不参与翻译</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">读取已有产品译文，商务数值不参与翻译</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M265 100 L355 100" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M605 100 L695 100" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M815 145 L660 270" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="25" y="55" width="240" height="90" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="145" y="82" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">确认并保存原报价</text><text x="145" y="105" font-size="14" text-anchor="middle" fill="#334155">失败则留在原稿</text><text x="145" y="125" font-size="14" text-anchor="middle" fill="#334155">保留原语言和编号</text></g><g><rect x="355" y="55" width="250" height="90" rx="6" fill="#effaf5" stroke="#21835b"/><text x="480" y="82" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">读取本网站目标译文</text><text x="480" y="105" font-size="14" text-anchor="middle" fill="#334155">名称、栏目、技术参数</text><text x="480" y="125" font-size="14" text-anchor="middle" fill="#334155">缺译不静默使用中文</text></g><g><rect x="695" y="55" width="240" height="90" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="815" y="82" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">新编号的独立版本</text><text x="815" y="105" font-size="14" text-anchor="middle" fill="#334155">价格、数量、币种不变</text><text x="815" y="125" font-size="14" text-anchor="middle" fill="#334155">图片与客户信息保留</text></g><g><rect x="320" y="255" width="340" height="90" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="490" y="282" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">核对后保存并导出</text><text x="490" y="305" font-size="14" text-anchor="middle" fill="#334155">自定义商务文字人工复核</text><text x="490" y="325" font-size="14" text-anchor="middle" fill="#334155">固定 A4，服务器直接生成 PDF</text></g></g></svg>
