<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">先导入，再核对；写回需要单独确认</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">先导入，再核对；写回需要单独确认</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M270 140 L355 140" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M595 140 L695 140" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M800 190 L670 290" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M330 290 L170 190" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="30" y="90" width="240" height="100" rx="6" fill="#effaf5" stroke="#21835b"/><text x="150" y="117" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">已有 PB 网站</text><text x="150" y="140" font-size="14" text-anchor="middle" fill="#334155">栏目、产品、新闻、单页</text><text x="150" y="160" font-size="14" text-anchor="middle" fill="#334155">保留原 static 图片</text></g><g><rect x="355" y="90" width="240" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="475" y="117" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">中央管理库</text><text x="475" y="140" font-size="14" text-anchor="middle" fill="#334155">按 siteId 保存</text><text x="475" y="160" font-size="14" text-anchor="middle" fill="#334155">中文 + 已有外语版本</text></g><g><rect x="695" y="90" width="240" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="815" y="117" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">核对与编辑</text><text x="815" y="140" font-size="14" text-anchor="middle" fill="#334155">数量、图片、参数、翻译</text><text x="815" y="160" font-size="14" text-anchor="middle" fill="#334155">先不执行全站覆盖</text></g><g><rect x="300" y="290" width="410" height="65" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="505" y="317" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">写回 PB 是另一项操作</text><text x="505" y="340" font-size="14" text-anchor="middle" fill="#334155">备份 → 选范围 → 确认 → 验证</text></g></g></svg>
