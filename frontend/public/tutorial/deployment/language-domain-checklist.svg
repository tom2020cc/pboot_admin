<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">每个语言域名单独核对，共用正确的 PB 站点规则</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">每个语言域名单独核对，共用正确的 PB 站点规则</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M290 95 L340 95" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M610 95 L660 95" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M797 150 L797 230" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M660 285 L615 285" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M340 285 L295 285" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="25" y="45" width="265" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="157.5" y="72" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">1. DNS 与站点绑定</text><text x="157.5" y="95" font-size="14" text-anchor="middle" fill="#334155">解析到业务服务器</text><text x="157.5" y="115" font-size="14" text-anchor="middle" fill="#334155">绑定当前 PHP 网站</text></g><g><rect x="345" y="45" width="265" height="100" rx="6" fill="#effaf5" stroke="#21835b"/><text x="477.5" y="72" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">2. HTTPS 与官方授权</text><text x="477.5" y="95" font-size="14" text-anchor="middle" fill="#334155">证书覆盖当前语言域名</text><text x="477.5" y="115" font-size="14" text-anchor="middle" fill="#334155">PB 保留并补充合法授权</text></g><g><rect x="665" y="45" width="265" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="797.5" y="72" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">3. 语言区域与模板</text><text x="797.5" y="95" font-size="14" text-anchor="middle" fill="#334155">纯域名匹配语言编码</text><text x="797.5" y="115" font-size="14" text-anchor="middle" fill="#334155">模板目录不是网站 root</text></g><g><rect x="665" y="235" width="265" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="797.5" y="262" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">4. URL 规则与模式</text><text x="797.5" y="285" font-size="14" text-anchor="middle" fill="#334155">同一站点共用伪静态</text><text x="797.5" y="305" font-size="14" text-anchor="middle" fill="#334155">PB 链接生成模式另行核对</text></g><g><rect x="345" y="235" width="265" height="100" rx="6" fill="#effaf5" stroke="#21835b"/><text x="477.5" y="262" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">5. 逐页面验收</text><text x="477.5" y="285" font-size="14" text-anchor="middle" fill="#334155">首页、栏目、详情与图片</text><text x="477.5" y="305" font-size="14" text-anchor="middle" fill="#334155">分页、搜索、语言切换</text></g><g><rect x="25" y="235" width="265" height="100" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="157.5" y="262" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">6. 留证与回退</text><text x="157.5" y="285" font-size="14" text-anchor="middle" fill="#334155">记录实际成功和待配置项</text><text x="157.5" y="305" font-size="14" text-anchor="middle" fill="#334155">配置备份留在非公开目录</text></g></g></svg>
