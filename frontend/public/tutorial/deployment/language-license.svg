<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">语言子域名：逐层定位，不盲目替换伪静态</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">语言子域名：逐层定位，不盲目替换伪静态</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M300 80 L340 80" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M615 80 L655 80" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M795 135 L745 225" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="30" y="35" width="270" height="95" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="165" y="62" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">DNS / TLS / Nginx</text><text x="165" y="85" font-size="14" text-anchor="middle" fill="#334155">解析、证书、server_name</text><text x="165" y="105" font-size="14" text-anchor="middle" fill="#334155">root、PHP 入口及访问日志</text></g><g><rect x="345" y="35" width="270" height="95" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="480" y="62" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">应用实际响应</text><text x="480" y="85" font-size="14" text-anchor="middle" fill="#334155">主域名 200，中文域名 404</text><text x="480" y="105" font-size="14" text-anchor="middle" fill="#334155">PHP 提示该子域名授权未匹配</text></g><g><rect x="660" y="35" width="270" height="95" rx="6" fill="#effaf5" stroke="#21835b"/><text x="795" y="62" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">官方授权</text><text x="795" y="85" font-size="14" text-anchor="middle" fill="#334155">获取实际域名对应的授权码</text><text x="795" y="105" font-size="14" text-anchor="middle" fill="#334155">PB 配置补充，保留原有授权</text></g><g><rect x="345" y="230" width="400" height="110" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="545" y="257" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">逐语言验收</text><text x="545" y="280" font-size="14" text-anchor="middle" fill="#334155">核对语言域名、模板及当前语言</text><text x="545" y="300" font-size="14" text-anchor="middle" fill="#334155">检查首页、栏目、详情与图片</text><text x="545" y="320" font-size="14" text-anchor="middle" fill="#334155">授权补充前不标记为修复完成</text></g></g></svg>
