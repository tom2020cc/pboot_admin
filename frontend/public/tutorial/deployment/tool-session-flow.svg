<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">同一账号、独立会话；先保护应用，再替换旧弹窗</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">同一账号、独立会话；先保护应用，再替换旧弹窗</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M290 95 L340 95" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M610 95 L660 95" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M797 150 L797 225" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M660 285 L615 285" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M340 285 L295 285" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="25" y="45" width="265" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="157.5" y="72" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">1. 浏览器 HTTPS</text><text x="157.5" y="95" font-size="14" text-anchor="middle" fill="#334155">可见邮箱密码表单</text><text x="157.5" y="115" font-size="14" text-anchor="middle" fill="#334155">POST 来源必须匹配本域</text></g><g><rect x="345" y="45" width="265" height="100" rx="6" fill="#effaf5" stroke="#21835b"/><text x="477.5" y="72" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">2. 工具登录网关</text><text x="477.5" y="95" font-size="14" text-anchor="middle" fill="#334155">SEO / FTP 各自会话</text><text x="477.5" y="115" font-size="14" text-anchor="middle" fill="#334155">安全 Cookie，不跨主机共享</text></g><g><rect x="665" y="45" width="265" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="797.5" y="72" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">3. 主后台认证 API</text><text x="797.5" y="95" font-size="14" text-anchor="middle" fill="#334155">回环校验现有账号</text><text x="797.5" y="115" font-size="14" text-anchor="middle" fill="#334155">每次检查身份有效性</text></g><g><rect x="665" y="230" width="265" height="110" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="797.5" y="257" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">4. 会话与退出</text><text x="797.5" y="280" font-size="14" text-anchor="middle" fill="#334155">最长 8 小时，重启失效</text><text x="797.5" y="300" font-size="14" text-anchor="middle" fill="#334155">退出该工具后接口拒绝</text><text x="797.5" y="320" font-size="14" text-anchor="middle" fill="#334155">后台不可用则拒绝访问</text></g><g><rect x="345" y="230" width="265" height="110" rx="6" fill="#effaf5" stroke="#21835b"/><text x="477.5" y="257" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">5. SEO 调用 FTP</text><text x="477.5" y="280" font-size="14" text-anchor="middle" fill="#334155">回环 API 携带已验证身份</text><text x="477.5" y="300" font-size="14" text-anchor="middle" fill="#334155">不向公网转发用户凭据</text><text x="477.5" y="320" font-size="14" text-anchor="middle" fill="#334155">无凭据仍然拒绝</text></g><g><rect x="25" y="230" width="265" height="110" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="157.5" y="257" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">6. 浏览器实际验收</text><text x="157.5" y="280" font-size="14" text-anchor="middle" fill="#334155">登录、页面、退出均检查</text><text x="157.5" y="300" font-size="14" text-anchor="middle" fill="#334155">保留来源校验和 HTTPS</text><text x="157.5" y="320" font-size="14" text-anchor="middle" fill="#334155">不以发布操作代替验证</text></g></g></svg>
