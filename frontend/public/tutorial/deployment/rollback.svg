<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">先保存当前状态，再恢复对应层</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">先保存当前状态，再恢复对应层</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><g><rect x="25" y="60" width="225" height="90" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="137.5" y="87" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">前端问题</text><text x="137.5" y="110" font-size="14" text-anchor="middle" fill="#334155">匹配版本 frontend/dist</text><text x="137.5" y="130" font-size="14" text-anchor="middle" fill="#334155">重新验证静态资源</text></g><g><rect x="365" y="60" width="225" height="90" rx="6" fill="#effaf5" stroke="#21835b"/><text x="477.5" y="87" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">API 问题</text><text x="477.5" y="110" font-size="14" text-anchor="middle" fill="#334155">匹配源码 + backend/dist</text><text x="477.5" y="130" font-size="14" text-anchor="middle" fill="#334155">单实例重启 API</text></g><g><rect x="705" y="60" width="230" height="90" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="820" y="87" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">Nginx 配置问题</text><text x="820" y="110" font-size="14" text-anchor="middle" fill="#334155">只恢复该站配置</text><text x="820" y="130" font-size="14" text-anchor="middle" fill="#334155">nginx -t 后重载</text></g><g><rect x="190" y="255" width="590" height="100" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="485" y="282" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">数据库回退需要单独判断</text><text x="485" y="305" font-size="14" text-anchor="middle" fill="#334155">停止写库进程 → 另存当前库 → 检查结构兼容</text><text x="485" y="325" font-size="14" text-anchor="middle" fill="#334155">不能仅因页面打不开就覆盖新数据</text></g></g></svg>
