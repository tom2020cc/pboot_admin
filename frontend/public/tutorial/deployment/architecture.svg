<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">一套管理系统，多个独立网站</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">一套管理系统，多个独立网站</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M250 110 L350 70" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M250 140 L350 190" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M580 70 L680 110" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M580 190 L680 140" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M140 175 L350 295" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M800 175 L630 295" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="30" y="75" width="220" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="140" y="102" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">管理后台</text><text x="140" y="125" font-size="14" text-anchor="middle" fill="#334155">Vue + API</text><text x="140" y="145" font-size="14" text-anchor="middle" fill="#334155">账号、站点与内容管理</text></g><g><rect x="350" y="30" width="230" height="80" rx="6" fill="#effaf5" stroke="#21835b"/><text x="465" y="57" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">SEO / 模型工具</text><text x="465" y="80" font-size="14" text-anchor="middle" fill="#334155">共享模型，按站点配置</text></g><g><rect x="350" y="155" width="230" height="80" rx="6" fill="#effaf5" stroke="#21835b"/><text x="465" y="182" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">FTP / 发布工具</text><text x="465" y="205" font-size="14" text-anchor="middle" fill="#334155">按站点保存目标与断点</text></g><g><rect x="680" y="75" width="245" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="802.5" y="102" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">独立 PB 业务站</text><text x="802.5" y="125" font-size="14" text-anchor="middle" fill="#334155">Nginx + PHP</text><text x="802.5" y="145" font-size="14" text-anchor="middle" fill="#334155">各自 data / static / template</text></g><g><rect x="300" y="295" width="370" height="70" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="485" y="322" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">同机读取与写回都带 siteId</text><text x="485" y="345" font-size="14" text-anchor="middle" fill="#334155">共享程序不等于共享内容库</text></g></g></svg>
