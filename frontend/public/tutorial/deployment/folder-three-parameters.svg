<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">按网站隔离，先扫描，确认后补齐 PB 字段</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">按网站隔离，先扫描，确认后补齐 PB 字段</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M280 112 L345 112" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M605 112 L670 112" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M800 175 L680 255" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="25" y="55" width="255" height="115" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="152.5" y="82" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">1. 当前型号的 TXT</text><text x="152.5" y="105" font-size="14" text-anchor="middle" fill="#334155">产品参数：名称（单位）：值</text><text x="152.5" y="125" font-size="14" text-anchor="middle" fill="#334155">固定前三项，顺序读取</text><text x="152.5" y="145" font-size="14" text-anchor="middle" fill="#334155">SEO 标题不作为参数</text></g><g><rect x="350" y="55" width="255" height="115" rx="6" fill="#effaf5" stroke="#21835b"/><text x="477.5" y="82" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">2. 扫描并核对</text><text x="477.5" y="105" font-size="14" text-anchor="middle" fill="#334155">同名同单位复用，否则新建</text><text x="477.5" y="125" font-size="14" text-anchor="middle" fill="#334155">T/kN 独立，冲突仍须核对</text><text x="477.5" y="145" font-size="14" text-anchor="middle" fill="#334155">此步不改 PB 或产品数据</text></g><g><rect x="675" y="55" width="255" height="115" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="802.5" y="82" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">3. 确认导入</text><text x="802.5" y="105" font-size="14" text-anchor="middle" fill="#334155">创建中文产品与共享参数</text><text x="802.5" y="125" font-size="14" text-anchor="middle" fill="#334155">补齐本次 PB 原生字段</text><text x="802.5" y="145" font-size="14" text-anchor="middle" fill="#334155">不发布产品、不改其他站</text></g><g><rect x="350" y="260" width="360" height="100" rx="6" fill="#effaf5" stroke="#21835b"/><text x="530" y="287" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">4. 正常同步网站</text><text x="530" y="310" font-size="14" text-anchor="middle" fill="#334155">产品参数值写入对应 PB 字段</text><text x="530" y="330" font-size="14" text-anchor="middle" fill="#334155">原模板不自动改写，历史数据不重写</text></g></g></svg>
