<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">工具打不开：先区别旧弹窗、当前登录与服务故障</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">工具打不开：先区别旧弹窗、当前登录与服务故障</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M225 150 L320 150" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M555 125 L655 85" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M555 175 L655 280" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="25" y="100" width="200" height="100" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="125" y="127" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">点击 SEO / FTP</text><text x="125" y="150" font-size="14" text-anchor="middle" fill="#334155">跳转独立子域名</text></g><g><rect x="320" y="100" width="235" height="100" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="437.5" y="127" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">检查响应层级</text><text x="437.5" y="150" font-size="14" text-anchor="middle" fill="#334155">Basic 401：旧规则仍在</text><text x="437.5" y="170" font-size="14" text-anchor="middle" fill="#334155">502：检查进程与代理</text></g><g><rect x="655" y="35" width="280" height="100" rx="6" fill="#effaf5" stroke="#21835b"/><text x="795" y="62" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">当前方案：网页登录</text><text x="795" y="85" font-size="14" text-anchor="middle" fill="#334155">303 跳转，表单为 200</text><text x="795" y="105" font-size="14" text-anchor="middle" fill="#334155">使用主后台完整账号登录</text></g><g><rect x="655" y="235" width="280" height="110" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="795" y="262" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">安全迁移旧版本</text><text x="795" y="285" font-size="14" text-anchor="middle" fill="#334155">先部署并验证应用保护</text><text x="795" y="305" font-size="14" text-anchor="middle" fill="#334155">再替换旧弹窗规则</text><text x="795" y="325" font-size="14" text-anchor="middle" fill="#334155">匿名 API 401 是预期结果</text></g></g></svg>
