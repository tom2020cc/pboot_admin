<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">源码更新，不覆盖运行资料</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">源码更新，不覆盖运行资料</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M290 110 L700 110" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M620 165 L700 165" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="30" y="80" width="260" height="115" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="160" y="107" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">中央管理数据</text><text x="160" y="130" font-size="14" text-anchor="middle" fill="#334155">data/pboot-admin.sqlite</text><text x="160" y="150" font-size="14" text-anchor="middle" fill="#334155">managed-sites/ · 私有 .env</text></g><g><rect x="360" y="80" width="260" height="115" rx="6" fill="#effaf5" stroke="#21835b"/><text x="490" y="107" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">各个 PB 网站</text><text x="490" y="130" font-size="14" text-anchor="middle" fill="#334155">data/*.db · static/</text><text x="490" y="150" font-size="14" text-anchor="middle" fill="#334155">template/ · 业务配置</text></g><g><rect x="700" y="80" width="235" height="115" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="817.5" y="107" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">独立非公开备份</text><text x="817.5" y="130" font-size="14" text-anchor="middle" fill="#334155">停写后复制数据库</text><text x="817.5" y="150" font-size="14" text-anchor="middle" fill="#334155">限制目录访问权限</text></g><g><rect x="175" y="280" width="610" height="75" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="480" y="307" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">源码包不包含依赖、账号、密钥和旧库</text><text x="480" y="330" font-size="14" text-anchor="middle" fill="#334155">更新代码与迁移数据是两种不同操作</text></g></g></svg>
