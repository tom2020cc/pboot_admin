<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">公网只进 Nginx，内部端口不公开</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">公网只进 Nginx，内部端口不公开</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M295 80 L375 80" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M295 190 L375 190" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M295 300 L375 300" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M630 80 L710 80" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="25" y="45" width="270" height="70" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="160" y="72" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">admin.example.com</text><text x="160" y="95" font-size="14" text-anchor="middle" fill="#334155">HTTPS 443</text></g><g><rect x="25" y="155" width="270" height="70" rx="6" fill="#effaf5" stroke="#21835b"/><text x="160" y="182" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">seo-admin.example.com</text><text x="160" y="205" font-size="14" text-anchor="middle" fill="#334155">HTTPS + 独立认证</text></g><g><rect x="25" y="265" width="270" height="70" rx="6" fill="#effaf5" stroke="#21835b"/><text x="160" y="292" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">ftp-admin.example.com</text><text x="160" y="315" font-size="14" text-anchor="middle" fill="#334155">HTTPS + 独立认证</text></g><g><rect x="375" y="45" width="255" height="70" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="502.5" y="72" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">127.0.0.1:5278</text><text x="502.5" y="95" font-size="14" text-anchor="middle" fill="#334155">Nginx 提供 Vue dist</text></g><g><rect x="375" y="155" width="255" height="70" rx="6" fill="#effaf5" stroke="#21835b"/><text x="502.5" y="182" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">127.0.0.1:5388</text><text x="502.5" y="205" font-size="14" text-anchor="middle" fill="#334155">SEO 与模型配置</text></g><g><rect x="375" y="265" width="255" height="70" rx="6" fill="#effaf5" stroke="#21835b"/><text x="502.5" y="292" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">127.0.0.1:5389</text><text x="502.5" y="315" font-size="14" text-anchor="middle" fill="#334155">FTP 与巡检</text></g><g><rect x="710" y="45" width="225" height="70" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="822.5" y="72" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">127.0.0.1:5108</text><text x="822.5" y="95" font-size="14" text-anchor="middle" fill="#334155">API /sites 等接口</text></g></g></svg>
