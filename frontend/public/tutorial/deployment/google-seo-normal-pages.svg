<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">按网站授权，提交 Sitemap，再核对索引</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs><rect width="960" height="440" fill="#fff"/><text x="30" y="32" font-size="21" font-weight="700" fill="#1d2939" font-family="Arial,Microsoft YaHei,sans-serif">按网站授权，提交 Sitemap，再核对索引</text><g transform="translate(0,40)" font-family="Arial,Microsoft YaHei,sans-serif"><path d="M285 120 L350 120" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M610 120 L675 120" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" fill="none"/><g><rect x="25" y="60" width="260" height="120" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="155" y="87" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">网站所有者授权</text><text x="155" y="110" font-size="14" text-anchor="middle" fill="#334155">验证 Search Console 属性</text><text x="155" y="130" font-size="14" text-anchor="middle" fill="#334155">服务账号获得完整权限</text><text x="155" y="150" font-size="14" text-anchor="middle" fill="#334155">只启用 Search Console API</text></g><g><rect x="350" y="60" width="260" height="120" rx="6" fill="#effaf5" stroke="#21835b"/><text x="480" y="87" font-size="17" font-weight="700" fill="#21835b" text-anchor="middle">本工具配置与检查</text><text x="480" y="110" font-size="14" text-anchor="middle" fill="#334155">核对当前网站与真实域名</text><text x="480" y="130" font-size="14" text-anchor="middle" fill="#334155">测试属性权限与公开文件</text><text x="480" y="150" font-size="14" text-anchor="middle" fill="#334155">提交 Sitemap 并读取状态</text></g><g><rect x="675" y="60" width="260" height="120" rx="6" fill="#eff6ff" stroke="#1762c4"/><text x="805" y="87" font-size="17" font-weight="700" fill="#1762c4" text-anchor="middle">内容与索引检查</text><text x="805" y="110" font-size="14" text-anchor="middle" fill="#334155">抽查首页、产品和新闻</text><text x="805" y="130" font-size="14" text-anchor="middle" fill="#334155">修复可抓取性与页面信息</text><text x="805" y="150" font-size="14" text-anchor="middle" fill="#334155">重要 URL 到官方手动请求</text></g><g><rect x="145" y="255" width="670" height="105" rx="6" fill="#fff4f2" stroke="#b63c32"/><text x="480" y="282" font-size="17" font-weight="700" fill="#b63c32" text-anchor="middle">不要混淆状态</text><text x="480" y="305" font-size="14" text-anchor="middle" fill="#334155">Sitemap 已收到，不等于已收录；索引查询不等于请求收录。</text><text x="480" y="325" font-size="14" text-anchor="middle" fill="#334155">普通产品和新闻不使用招聘 / 直播专用 Indexing API。</text></g></g></svg>
